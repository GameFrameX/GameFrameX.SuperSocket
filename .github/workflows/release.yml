name: Publish Release

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

jobs:
  release:
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
      packages: write
    uses: GameFrameX/public-github-actions/.github/workflows/publish-dotnet-release.yml@main
    with:
      dotnet_version: "10.0.x"
      version_props_path: "Directory.Build.props"
    secrets: inherit

  build-tag:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup .NET Core
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Install dotnet tool
        run: dotnet tool install -g dotnetCampus.TagToVersion

      - name: Set tag to version
        run: dotnet TagToVersion -t ${{ github.ref }} -f Directory.Build.props

      - name: Install dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: ./bin/app/*.nupkg
          if-no-files-found: error
          retention-days: 1

  publish-release:
    needs: release
    if: ${{ needs.release.result == 'success' && needs.release.outputs.release_needed == 'true' && needs.release.outputs.nuget_packages == 'true' }}
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download NuGet packages
        uses: actions/download-artifact@v8
        with:
          name: nuget-packages
          path: ./artifacts

      - name: Publish with NuGet Trusted Publishing
        uses: GameFrameX/public-github-actions/.github/actions/publish-nuget@main
        with:
          package-path: ./artifacts/*.nupkg
          nuget-user: ${{ secrets.NUGET_USER }}

  publish-tag:
    needs: build-tag
    if: needs.build-tag.result == 'success'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download NuGet packages
        uses: actions/download-artifact@v8
        with:
          name: nuget-packages
          path: ./artifacts

      - name: Publish with NuGet Trusted Publishing
        uses: GameFrameX/public-github-actions/.github/actions/publish-nuget@main
        with:
          package-path: ./artifacts/*.nupkg
          nuget-user: ${{ secrets.NUGET_USER }}
